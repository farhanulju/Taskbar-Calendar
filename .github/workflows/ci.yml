name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test TaskbarCalendar.sln -c Release --nologo

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarCalendar
          path: src/TaskbarCalendar/bin/Release/net481/TaskbarCalendar.exe
